---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo-deployment
  namespace: self-hosted
  labels:
    app: cicd-demo
    app.kubernetes.io/name: cicd-demo
    app.kubernetes.io/component: web
    app.kubernetes.io/managed-by: github-actions
spec:
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  replicas: 2
  selector:
    matchLabels:
      app: cicd-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cicd-demo
        app.kubernetes.io/name: cicd-demo
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dockerhub-image-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: cicd-demo
          image: hongsait/cpsy-350-ci-python:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-demo-service
  namespace: self-hosted
  labels:
    app: cicd-demo
    app.kubernetes.io/name: cicd-demo
    app.kubernetes.io/component: web
    app.kubernetes.io/managed-by: github-actions
spec:
  selector:
    app: cicd-demo
  ports:
    - protocol: TCP
      port: 3000
      targetPort: http
  type: ClusterIP
